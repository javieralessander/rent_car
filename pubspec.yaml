name: rent_car
description: "RentCar - Sistema de Gestión de Alquiler de Vehículos"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  #  Add your dependencies here based on your project needs
  flutter_localizations:
    sdk: flutter
  http: ^1.4.0
  go_router: ^15.1.2
  provider: ^6.1.5
  google_fonts: ^6.2.1
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.4
  cloud_firestore: ^5.6.8
  shared_preferences: ^2.5.3
  flutter_svg: ^2.1.0
  google_maps_flutter: ^2.12.2
  # intl: ^0.20.2
  geolocator: ^14.0.1
  crypto: ^3.0.5
  carousel_slider: ^5.0.0
  permission_handler: ^12.0.0+1
  flutter_localization: ^0.3.2
  fl_chart: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - .env.production
    - .env.development

    - assets/images/
    - assets/icons/
    - assets/svgs/
    - assets/lang/
